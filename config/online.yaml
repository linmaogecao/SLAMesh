slamesher:
  # play ros bag or run it in mobile robot, the configuration used in our real-world demo, the sensor is an ouster OS1-32 lidar
  #read param
  use_sim_time: true
  grt_available: false 
  odom_available: false 
  read_offline_pcd: false
  dataset: 1
  max_steps: 10000
  save_mesh_map: true       # 当前无效：mesh 链只能从 visualize/saveResult 进，两者均未被调用
  #register param
  range_max: 60
  range_min: 0.5
  register_times: 5
  cross_overlap: true
  cross_cell_overlap_length: 1
  num_margin_old_cell: -1
  point2mesh: true
  residual_combination: false
  #visualize parameter
  meshing_tsdf: false
  full_cover: true
  visualisation_type: 3
  #gp param
  num_thread: 8
  # 配准侧 footprint 并行线程数；0=沿用 num_thread
  num_thread_reg: 8
  # 每帧打印 障碍收集/匹配/求解 + 地面采样/匹配/求解 的分段耗时
  reg_time_breakdown: false
  # 障碍迭代间复用候选集：上轮位姿增量 <= 此值(m) 就不重扫 range image。会改结果，需 A/B
  obs_reuse_cand_delta: 0.0
  # 地面每格补点扩容只在最后一轮做。会改结果，需 A/B
  gnd_expand_last_iter_only: false
  grid: 1.2
  min_points_num_to_gp: 3
  num_test: 6
  
  variance_register: 0.60
  variance_map_update: 0.50
  variance_map_show: 0.20
  variance_min: 1.36
  variance_sensor: 0.02
  
  test_param:  0


