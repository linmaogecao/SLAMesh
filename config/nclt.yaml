slamesher:
  # NCLT dataset (Velodyne HDL-32E, inverted mounting)
  use_sim_time: false
  grt_available: false
  odom_available: false
  read_offline_pcd: true
  dataset: 3
  max_steps: 100000
  max_frames: 0
  dump_frame: 0
  dump_cluster_step: 0
  dump_occluded_step: 0
  dump_gnd_scan_begin: 0
  dump_gnd_scan_end: 0
  console_log_path: ""
  save_surface_samples: true
  all_surfaces_max_step: 0
  map_save_step_begin: 0
  map_save_step_end: 0
  save_mesh_map: false
  # ── Range Image (HDL-32E) ──────────────────────────────────────────────
  ri_h_scans: 32
  ri_w_cols: 1800
  ri_fov_up: 10.67
  ri_fov_down: -30.67
  # HDL-32E 倒装在车顶：原始坐标 X 前 Y 左 Z 下，翻转 Y/Z 变成标准 Z 朝上
  lidar_flip_yz: true
  # ── 配准参数 ───────────────────────────────────────────────────────────
  range_max: 80
  range_min: 1.0
  register_times: 4
  bootstrap_step2_tx: 0.3
  bootstrap_step2_ty: 0.0
  bootstrap_step2_tz: 0.0
  map_update_interval: 5
  ground_build_interval: 5
  map_unmatched_ratio_min: 0.30
  cluster_ds_min_pts: 80
  cluster_ds_target_max: 200
  range_image_split: 25.0
  range_image_far_z_floor_offset: 20
  range_image_far_min_cluster: 20
  obs_rimg_col_step: 3
  obs_match_per_surf_max: 50
  obs_cand_target: 1500
  obs_reg_use_pw_mask: true
  # ── Patchwork++ ────────────────────────────────────────────────────────
  use_patchwork_ground: true
  pw_sensor_height: 1.5
  pw_num_iter: 3
  pw_num_lpr: 20
  pw_num_min_pts: 10
  pw_th_seeds: 0.3
  pw_th_dist: 0.125
  pw_th_seeds_v: 0.25
  pw_th_dist_v: 0.1
  pw_max_r: 60.0
  pw_min_r: 2.0
  pw_uprightness_thr: 0.707
  pw_adaptive_seed_selection_margin: -1.2
  pw_enable_RVPF: true
  pw_enable_TGR: true
  # ── 地面栅格 ───────────────────────────────────────────────────────────
  ground_z_min: -3.0
  ground_z_max: -0.8
  ground_cell_size: 6.0
  ground_cell_min_pts: 60
  ground_cell_num_cp: 5
  ground_query_radius: 1
  ground_cell_max_pts: 400
  ground_fit_max_pts: 150
  ground_cell_z_filter: false
  ground_cell_z_pct: 0.5
  ground_cell_z_tol: 0.4
  ground_skip_points: 40
  ground_reg_cell_size: 5.0
  ground_reg_cell_max_pts: 30
  ground_reg_cell_max_pts_front: 90
  ground_reg_cell_target_pts: 25
  ground_reg_nbr_per_seed: 40
  ground_reg_y_max: 25.0
  ground_reg_x_max: 0.0
  ground_reg_x_max_front: 0.0
  ground_thr_last: 0.30
  predict_horizontal_only: false
  # HDL-32E 不需要 HDL-64 的竖直角标定修正
  scan_correct_deg: 0.0
  scan_correct_ground_only: true
  reg_alternations: 1
  obs_thr_last: 0.2
  obs_huber: 0.5
  obs_ceres_iters: 1
  obs_seg_normal_deg: 0.0
  obs_fit_max_dist: 0.0
  obs_fit_split_dist: 0.0
  obs_edge_mode: 0
  obs_edge_tan_max: 2.0
  obs_map_replace_frac: 0.0
  obs_map_voxel_owner: false
  obs_fit_max_iter: 10
  obs_fit_eps: 0.05
  obs_fit_weight_sigma: 0.0
  obs_fit_weight_adj: true
  obs_fit_pts_per_cp: 0.0
  ground_map_r_max: 0.0
  ground_reg_total_max: 4000
  ground_reg_match_max: 2500
  ground_reg_fb_x0: 5.0
  ground_reg_fb_front: 0.40
  ground_reg_fb_mid: 0.25
  ground_reg_fb_back: 0.35
  ground_coarse_cell_size: 20.0
  ground_coarse_min_pts: 30
  ground_coarse_num_cp: 7
  ground_coarse_query_radius: 1
  ground_coarse_cell_max_pts: 600
  ground_coarse_fit_max_pts: 250
  gnd_ri_z_min: -3.0
  gnd_ri_z_max: 0.0
  gnd_near_x_max: 20.0
  gnd_near_y_max: 10.0
  gnd_near_z_max: -1.0
  gnd_col_max_step: 0.1
  gnd_col_seed_h_up: 0.1
  gnd_normal_z_min: 0.5
  obs_starve_res_lo: 0
  obs_starve_res_hi: 0
  obs_starve_warmup: 30
  obs_prior_sigma_xy: 0.3
  obs_prior_sigma_yaw: 0.0
  obs_prior_along_only: true
  obs_lr_max_frac: 0.0
  obs_range_ref: 0.0
  gnd_roll_prior_sigma: 0.3
  gnd_pitch_prior_sigma: 0.3
  cross_overlap: true
  cross_cell_overlap_length: 1
  num_margin_old_cell: 500
  point2mesh: true
  residual_combination: true
  meshing_tsdf: false
  full_cover: false
  visualisation_type: 3
  num_thread: 8
  num_thread_reg: 8
  reg_time_breakdown: false
  obs_reuse_cand_delta: 0.0
  gnd_expand_last_iter_only: false
  grid: 2
  min_points_num_to_gp: 11
  num_test: 6
  variance_register: 0.60
  variance_map_update: 0.50
  variance_map_show: 1.00
  variance_min: 1.36
  variance_sensor: 0.02
  test_param: 0
