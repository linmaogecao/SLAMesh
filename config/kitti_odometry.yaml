slamesher:
  # kitti: odometry test, no mesh output, the mesh map also not fully cover a cell
  #read param
  use_sim_time: false 
  grt_available: false 
  odom_available: false 
  read_offline_pcd: true 
  dataset: 1
  max_steps: 10000
  max_frames: 0      # 0=跑完 sequence；>0 时处理完该帧后退出（调试用，如 100）
  dump_frame: 0        # 0=不保存；>0 时导出 matched/unmatched/scan_world + 远距 cluster 漏斗统计
  dump_cluster_step: 0   # 0=不保存；>0 时导出 cluster 到 build/output_clusters/
  dump_occluded_step: 0 # 0=不保存；>0 时导出 range image 入图点 + 被遮挡点到 build/rangeimage_*,occluded_*.txt
  console_log_path: "/home/albus/catkin_ws/src/SLAMesh/debug.txt"   # 空=自动写到 file_loc_report/seq##_run_时间.log；也可填绝对路径如 debug.txt
  save_surface_samples: false  # true 时在 global_map/ 下按序号保存曲面稀疏采样点（全序列）
  all_surfaces_max_step: 0  # 0=不限；>0 时 all_surfaces.txt 只含 created_step<=此值的曲面（如 60）
  map_save_step_begin: 0  # 与 end 配合的 step 闭区间过滤（all_surfaces_max_step>0 时优先）
  map_save_step_end:   0  # 0=不限；例 begin=100 end=150 只导出该区间新建的曲面
  save_mesh_map: false
  #register param
  range_max: 100
  range_min: 1.2
  register_times: 4
  # 无 odom 时第 2 帧配准初值：相对第 1 帧 Velodyne +X 方向平移 (m)
  bootstrap_step2_tx: 0.8
  bootstrap_step2_ty: 0.0
  bootstrap_step2_tz: 0.0
  map_update_interval: 5      # 障碍 MapUpdate 间隔（帧）；step % N == 0 时建障碍曲面
  ground_build_interval: 10    # 地面 buildGroundMap 间隔（帧）；第1帧 + step % N == 0
  map_unmatched_ratio_min: 0.30 # 簇内未匹配比例 >= 此值才新建障碍曲面
  cluster_ds_min_pts:    80   # cluster 像素数 <= 此值不抽稀
  cluster_ds_target_max: 200   # 大 cluster 按 range-image (u,v) 2D 均匀稀疏到此规模（0=关闭）
  range_image_split: 30.0      # 两层 range image 分界距离（米）；0=禁用远层（退化为单层）
  range_image_far_z_floor_offset: 20  # 远层 z_floor = ground_z_min - offset（建图/配准/审计统一）
  range_image_far_min_cluster: 20  # 远层 cluster 最小点数（建议略小于近层 30）
  obs_rimg_col_step: 3         # 旧均匀采样列间隔（簇模式不用）
  obs_match_per_surf_max: 80   # 每个障碍曲面最多保留点数（多簇绑同一面时限流；0=不限）
  obs_cluster_min_pts: 30      # 配准聚类最小点数
  obs_cluster_vote_samples: 60 # 每簇几何打分采样点数
  obs_cluster_query_radius: 1  # 体素只提名附近曲面
  obs_cluster_score_dist: 0.50 # 选面 inlier 门限（m）
  obs_cluster_select_dist_max: 0.80  # 中位距离超过则不绑（按最近面）
  obs_cluster_match_max_pts: 80     # 每簇绑定后最多保留点数
  obs_cluster_skip_flat: true       # 跳过近似水平簇（|nz|>0.85）
  # XY 栅格地面地图
  ground_cell_size: 6.0      # 每格 XY 边长（米）
  ground_cell_min_pts: 80    # 格内点数达此值才拟合曲面
  ground_cell_num_cp: 5      # BSpline 每维控制点数
  ground_query_radius: 1     # 配准查询格半径（格数）
  ground_map_skip_points: 8  # 建图：z 带内每隔 N 点取 1 点投格（1=不跳）
  ground_cell_max_pts: 400   # 每格最多保留点数（超出均匀下采样）
  ground_fit_max_pts: 150    # 每格 BSpline 拟合最多用点数
  ground_skip_points: 80     # 地面配准采样间隔
  ground_clear_dist: 150.0   # 超过此距离（米）的旧格被清除
  cross_overlap: true
  cross_cell_overlap_length: 1
  num_margin_old_cell: 500
  point2mesh: true
  residual_combination: true
  #visualize parameter
  meshing_tsdf: false
  full_cover: false
  visualisation_type: 3
  #gp param / OMP 建图并行线程数（障碍 apply + 地面格 apply 均使用）
  num_thread: 8
  grid: 2
  min_points_num_to_gp: 11
  num_test: 6
  
  variance_register: 0.60
  variance_map_update: 0.50
  variance_map_show: 1.00
  variance_min: 1.36
  variance_sensor: 0.02
  
  test_param:  0


