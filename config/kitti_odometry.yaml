slamesher:
  # kitti: odometry test, no mesh output, the mesh map also not fully cover a cell
  #read param
  use_sim_time: false 
  grt_available: false 
  odom_available: false 
  read_offline_pcd: true 
  dataset: 1
  max_steps: 10000
  max_frames: 201          # 0=跑完 sequence；>0 时处理完该帧后退出（调试用，如 100）
  dump_frame: 200          # 0=不保存；>0 时在该帧配准结束后保存世界系点云+匹配/未匹配点
  save_surface_samples: true  # true 时在 global_map/ 下按序号保存曲面稀疏采样点
  save_mesh_map: false
  #register param
  range_max: 100
  range_min: 1.2
  register_times: 2
  ground_w_rp: 3.0    # 地面 roll/pitch 约束权重（Ceres GroundPlaneConstraint）
  ground_w_z:  3.0    # 地面高度约束权重
  cross_overlap: true
  cross_cell_overlap_length: 1
  num_margin_old_cell: 500
  point2mesh: true
  residual_combination: true
  #visualize parameter
  meshing_tsdf: false
  full_cover: false
  visualisation_type: 3
  #gp param
  num_thread: 8
  grid: 1.6
  min_points_num_to_gp: 11
  num_test: 6
  
  variance_register: 0.60
  variance_map_update: 0.50
  variance_map_show: 1.00
  variance_min: 1.36
  variance_sensor: 0.02
  
  test_param:  0


