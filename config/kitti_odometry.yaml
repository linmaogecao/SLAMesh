slamesher:
  # kitti: odometry test, no mesh output, the mesh map also not fully cover a cell
  #read param
  use_sim_time: false 
  grt_available: false 
  odom_available: false 
  read_offline_pcd: true 
  dataset: 1
  max_steps: 10000
  max_frames: 150      # 0=跑完 sequence；>0 时处理完该帧后退出（调试用，如 100）
  dump_frame: 150        # 0=不保存；>0 时导出 matched/unmatched/scan_world + 远距 cluster 漏斗统计
  dump_cluster_step: 0   # 0=不保存；>0 时导出 cluster 到 build/output_clusters/
  dump_occluded_step: 0 # 0=不保存；>0 时导出 range image 入图点 + 被遮挡点到 build/rangeimage_*,occluded_*.txt
  dump_gnd_scan_begin: 95  # 闭区间起点；写 gnd_scan/（过 thr 匹配点）+ whole_gnd/（z带初分类地面点）+ scan_world/（全量世界系点）；启动先清空
  dump_gnd_scan_end: 150    # 闭区间终点；任一为 0 则关闭
  gnd_diag_begin: 90      # 闭区间：打印地面诊断（分类砍点/建图clip/匹配残差分bin）；看 pitch 跟丢时设 58..61
  gnd_diag_end: 150        # 任一为 0 则关闭；改区间即可，无需改代码
  console_log_path: "/home/albus/catkin_ws/src/SLAMesh/debug.txt"   # 空=自动写到 file_loc_report/seq##_run_时间.log；也可填绝对路径如 debug.txt
  save_surface_samples: true  # true 时在 global_map/ 下按序号保存曲面稀疏采样点（全序列）
  all_surfaces_max_step: 0 # 0=不限；>0 时 all_surfaces.txt 只含 created_step<=此值的曲面（如 60）
  map_save_step_begin: 70 # 与 end 配合的 step 闭区间过滤（all_surfaces_max_step>0 时优先）
  map_save_step_end:   150  # 0=不限；例 begin=100 end=150 只导出该区间新建的曲面
  save_mesh_map: false
  #register param
  range_max: 100
  range_min: 1.2
  register_times: 4
  # 无 odom 时第 2 帧配准初值：相对第 1 帧 Velodyne +X 方向平移 (m)
  bootstrap_step2_tx: 0.2
  bootstrap_step2_ty: 0.0
  bootstrap_step2_tz: 0.0
  map_update_interval: 5      # 障碍 MapUpdate 间隔（帧）；step % N == 0 时建障碍曲面
  ground_build_interval: 5    # 地面 buildGroundMap 间隔（帧）；第1帧 + step % N == 0
  map_unmatched_ratio_min: 0.30 # 簇内未匹配比例 >= 此值才新建障碍曲面
  cluster_ds_min_pts:    80   # cluster 像素数 <= 此值不抽稀
  cluster_ds_target_max: 200   # 大 cluster 按 range-image (u,v) 2D 均匀稀疏到此规模（0=关闭）
  range_image_split: 30.0      # 两层 range image 分界距离（米）；0=禁用远层（退化为单层）
  range_image_far_z_floor_offset: 20  # 远层 z_floor = ground_z_min - offset（建图/配准/审计统一）
  range_image_far_min_cluster: 20  # 远层 cluster 最小点数（建议略小于近层 30）
  obs_rimg_col_step: 3         # 障碍配准 range image 列采样间隔（1=全取，3=每3列1点）
  obs_match_per_surf_max: 50   # 每个障碍曲面最多保留的匹配点数（0=不限；防止长物体垄断）
  # XY 栅格地面地图
  ground_z_min: -3.8         # 传感器系地面点 z 下界（建图/配准共用）
  ground_z_max: -0.5       # 传感器系地面点 z 上界（建图/配准共用）
  ground_cell_size: 6.0      # 每格 XY 边长（米）
  ground_cell_min_pts: 60    # 格内点数达此值才拟合曲面
  ground_cell_num_cp: 5      # BSpline 每维控制点数
  ground_query_radius: 1     # 配准查询格半径（格数）
  ground_map_skip_points: 8  # 保留字段（当前投格前逻辑不再用固定 stride）
  ground_map_skip_above: 0    # <=0：投格前不 skip（推荐）；>0：候选超过此数才均匀抽到该数量
  ground_cell_max_pts: 400   # 每格最多保留点数（超出均匀下采样）
  ground_fit_max_pts: 150    # 每格 BSpline 拟合最多用点数
  ground_cell_z_pct: 0.0     # 建图格内 z 参考：(0,1]=分位；<=0 用均值（默认）
  ground_cell_z_tol: 0.2     # 建图：砍掉 z > z_ref+tol 的点（米）；<=0 关闭
  ground_skip_points: 40     # 地面配准采样间隔（ground_reg_cell_size>0 时不生效）
  ground_clear_dist: 150.0   # 超过此距离（米）的旧格被清除
  ground_reg_cell_size: 5.0  # 配准时 XY 均匀采样格边长（米）；0=退化为 skip 模式
  ground_reg_cell_max_pts: 30 # 每个采样格最多取点数
  ground_reg_y_max: 0         # 配准：<=0 不限制（弯道侧后方点不被截断）
  # ── 地面点 XY 格子分类 ──
  gnd_cell_enabled:  true    # true=列向传播+格子过滤；false=退化为纯 z 带
  gnd_col_max_step:  0.1    # 列向传播：同列相邻环 |Δz| 上限（m）；超出只断链开新段，不整列停止（整列仅 z>=ground_z_max 停）
  gnd_cell_size:     5.0     # XY 格子边长（米）
  gnd_cell_z_pct:    0.10    # 格内 z 低分位（10%）作参考高度
  gnd_cell_z_tol:    0.15    # 高于参考的上容差（m）；偏严以排除低矮障碍物
  # ── 地面配准分层采样（r_signed 距离 bin，后方到 -50m）──
  # [-50,-30)/[-30,-20)/[-20,-10)/[-10,0)/[0,5)/[5,10)/[10,20)/[20,40]
  # 总配额约 1640；加重后极远/后远杠杆；前远 bin7 无图 cap=0
  gnd_stratified_enabled: true
  gnd_bin_cap_0:  240   # bin-0: 后极远 [-50,-30)
  gnd_bin_cap_1:  260   # bin-1: 后远   [-30,-20)
  gnd_bin_cap_2:  260   # bin-2: 后中   [-20,-10)
  gnd_bin_cap_3:  200   # bin-3: 后近   [-10,0)
  gnd_bin_cap_4:  200   # bin-4: 前近   [0,5)
  gnd_bin_cap_5:  240   # bin-5: 前中近 [5,10)
  gnd_bin_cap_6:  240   # bin-6: 前中   [10,20)
  gnd_bin_cap_7:  0     # bin-7: 前远   [20,40]，未建图，不采样
  cross_overlap: true
  cross_cell_overlap_length: 1
  num_margin_old_cell: 500
  point2mesh: true
  residual_combination: true
  #visualize parameter
  meshing_tsdf: false
  full_cover: false
  visualisation_type: 3
  #gp param / OMP 建图并行线程数（障碍 apply + 地面格 apply 均使用）
  num_thread: 8
  grid: 2
  min_points_num_to_gp: 11
  num_test: 6
  
  variance_register: 0.60
  variance_map_update: 0.50
  variance_map_show: 1.00
  variance_min: 1.36
  variance_sensor: 0.02
  
  test_param:  0


