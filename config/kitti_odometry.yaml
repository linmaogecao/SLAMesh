slamesher:
  # kitti: odometry test, no mesh output, the mesh map also not fully cover a cell
  #read param
  use_sim_time: false 
  grt_available: false 
  odom_available: false 
  read_offline_pcd: true 
  dataset: 1
  max_steps: 10000
  max_frames: 60        # 0=跑完 sequence；>0 时处理完该帧后退出（调试用，如 100）
  dump_frame: 60          # 0=不保存；>0 时在对应 step 配准结束后导出 matched/unmatched 到 build/
  dump_cluster_step: 60   # 0=不保存；>0 时导出 cluster 到 build/output_clusters/
  dump_occluded_step: 60 # 0=不保存；>0 时导出 range image 入图点 + 被遮挡点到 build/rangeimage_*,occluded_*.txt
  console_log_path: "/home/albus/catkin_ws/src/SLAMesh/debug.txt"   # 空=自动写到 file_loc_report/seq##_run_时间.log；也可填绝对路径如 debug.txt
  save_surface_samples: false  # true 时在 global_map/ 下按序号保存曲面稀疏采样点（全序列）
  all_surfaces_max_step: 0  # 0=不限；>0 时 all_surfaces.txt 只含 created_step<=此值的曲面（如 60）
  map_save_step_begin: 40  # 与 end 配合的 step 闭区间过滤（all_surfaces_max_step>0 时优先）
  map_save_step_end:   80  # 0=不限；例 begin=100 end=150 只导出该区间新建的曲面
  save_mesh_map: false
  #register param
  range_max: 150
  range_min: 1.2
  register_times: 2
  map_update_interval: 5      # 障碍 MapUpdate 间隔（帧）；step % N == 0 时建障碍曲面
  ground_build_interval: 10    # 地面 buildGroundMap 间隔（帧）；第1帧 + step % N == 0
  map_unmatched_ratio_min: 0.30 # 簇内未匹配比例 >= 此值才新建障碍曲面
  cluster_ds_min_pts:    80   # cluster 像素数 <= 此值不抽稀
  cluster_ds_target_max: 200   # 大 cluster 按 range-image (u,v) 2D 均匀稀疏到此规模（0=关闭）
  ground_near_x: 15.0   # 地面建图+配准：雷达系前后 |x| < 此值（m）；0=不限
  ground_near_y: 5.0    # 地面建图+配准：雷达系左右 |y| < 此值（m）；0=不限
  # XY 栅格地面地图
  ground_cell_size: 6.0      # 每格 XY 边长（米）
  ground_cell_min_pts: 80    # 格内点数达此值才拟合曲面
  ground_cell_num_cp: 5      # BSpline 每维控制点数
  ground_query_radius: 1     # 配准查询格半径（格数）
  ground_skip_points: 80     # 地面配准采样间隔
  ground_clear_dist: 150.0   # 超过此距离（米）的旧格被清除
  cross_overlap: true
  cross_cell_overlap_length: 1
  num_margin_old_cell: 500
  point2mesh: true
  residual_combination: true
  #visualize parameter
  meshing_tsdf: false
  full_cover: false
  visualisation_type: 3
  #gp param
  num_thread: 8
  grid: 2
  min_points_num_to_gp: 11
  num_test: 6
  
  variance_register: 0.60
  variance_map_update: 0.50
  variance_map_show: 1.00
  variance_min: 1.36
  variance_sensor: 0.02
  
  test_param:  0


